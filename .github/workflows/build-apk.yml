name: 장비매니저 APK 제작

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 압축 풀기
        run: unzip -q jangbi-manager-source.zip -d source
      - name: Java 오류 수정
        run: sed -i 's/android\.app\.PrintManager/android.print.PrintManager/g' source/app/src/main/java/com/ollim/jangbimanager/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.3

      - name: Android SDK 설치
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 만들기
        run: cd source && gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jangbi-manager-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
